{% extends 'base.html'%}

{% block content %}

<style>
  /* Deep shadow for elegant depth */
  .deep-shadow {
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25) !important;
    border-radius: 15px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  /* Hover lift effect */
  .deep-shadow:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3) !important;
  }

  body {
    background-color: #f5f5f5;
  }

  /* Flex column layout to push meta/footer section down */
  .card-body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  /* Post content area grows naturally */
  .post-content {
    flex-grow: 1;
  }

  /* Card footer (meta + button) styling */
  .card-footer-custom {
    border-top: 1px solid #ddd;
    padding-top: 10px;
    margin-top: 15px;
  }

  /* Read More button styling */
  .btn-read {
    width: 100%;
    border-radius: 8px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .btn-read:hover {
    background-color: #000;
    color: #fff;
    transform: translateY(-2px);
  }
</style>

<div  class="container my-5">
  <div class="row g-4">
    {% for post in posts %}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 deep-shadow border-0">
          <div class="card-body">

            <!-- Post Title -->
            <h5 class="card-title fw-bold">{{ post.title }}</h5>

            <!-- Post Content -->
            <div class="post-content">
              <p class="card-text text-muted">{{ post.body|truncatewords:50 }}</p>
            </div>

            <!-- Footer Area (fixed at bottom) -->
            <div class="card-footer-custom">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <small class="text-secondary">By {{ post.author }}</small>
                <small class="text-secondary">• {{ post.created_on|date:"M d, Y" }}</small>
              </div>
              <a href="{% url 'post_detail' post.slug %}" class="btn btn-outline-dark btn-sm btn-read">
                Read More →
              </a>
            </div>

          </div>
        </div>
      </div>
    {% empty %}
      <p class="text-center mt-4">No posts available yet.</p>
    {% endfor %}
  </div>
</div>


{% endblock %}
