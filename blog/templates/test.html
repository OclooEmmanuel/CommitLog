    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ------------------------------------------- */
/* Glassmorphism Styles for the Navbar */
/* ------------------------------------------- */

/* 1. Target our custom class on the navbar */
.glass-navbar {
    /* 2. Semi-transparent background (White with 15% opacity) */
    background-color: rgba(255, 255, 255, 0.15);

    /* 3. THE KEY: Apply the blur filter to the background */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); /* For Safari support */

    /* 4. Add a subtle border and shadow for the glass effect */
    border-bottom: 1px solid rgba(255, 255, 255, 0.2); /* Light bottom border */
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15); /* Soft, subtle outer shadow */
}

/* 5. Custom style for links to ensure they stand out */
.glass-navbar .nav-link {
    color: #000000; /* Default link color (Dark) */
    padding: 0.5rem 1rem;
    border-radius: 0.3rem; /* Nice rounded look */
    transition: background-color 0.2s ease-in-out;
}

/* 6. Active and Hover States */
.glass-navbar .nav-link.active,
.glass-navbar .nav-link:hover {
    /* Slightly more opaque background on hover/active */
    background-color: rgba(255, 255, 255, 0.4);
    color: #0d6efd; /* Use Bootstrap primary color on hover/active */
}

/* 7. Brand styling */
.glass-navbar .navbar-brand {
    color: #000000; /* Dark color for brand text */
}

/* 8. Toggler Icon Fix (optional, to make it darker/more visible) */
.glass-navbar .navbar-toggler-icon {
    /* Custom filter to make the icon lines black for better contrast on a light background */
    filter: invert(0) grayscale(100%);
}
  </style>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
