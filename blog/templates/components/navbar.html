<nav class="navbar navbar-expand-lg navbar-dark navbar-commitlog sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'blog:post_list' %}">
      <i class="fa-solid fa-terminal"></i>
      CommitLog
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'post_list' %}active{% endif %}"
             href="{% url 'blog:post_list' %}">Home</a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'post_add' %}active{% endif %}"
             href="{% url 'blog:post_add' %}">
            <i class="bi bi-plus-lg"></i> New Post
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'user_posts' %}active{% endif %}"
             href="{% url 'blog:user_posts' %}">My Posts</a>
        </li>
        {% endif %}
      </ul>

      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <div class="dropdown">
            <button class="btn btn-commitlog btn-commitlog-outline btn-sm dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle me-1"></i>
              {{ user.username }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end" style="background:var(--bg-secondary);border-color:var(--border);min-width:180px;">
              <li>
                <a class="dropdown-item" href="{% url 'blog:user_posts' %}"
                   style="color:var(--text-primary);">
                  <i class="bi bi-file-text me-2"></i>My Posts
                </a>
              </li>
              <li><hr class="dropdown-divider" style="border-color:var(--border);"></li>
              <li>
                <a class="dropdown-item" href="{% url 'logout' %}"
                   style="color:var(--accent-red);">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
              </li>
            </ul>
          </div>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-commitlog btn-commitlog-primary btn-sm">Login</a>
          <a href="{% url 'register' %}" class="btn btn-commitlog btn-commitlog-outline btn-sm">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
