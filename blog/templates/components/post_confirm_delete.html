{% if post.slug %}
<div class="modal fade" id="deleteModal{{ post.id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--bg-secondary);border:1px solid var(--border);">
      <div class="modal-header" style="border-bottom-color:var(--border);">
        <h5 class="modal-title fw-bold" style="color:var(--accent-red);">
          <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="bi bi-trash3" style="font-size:3rem;color:var(--accent-red);"></i>
        <h5 class="fw-bold mt-3 mb-2">Are you sure?</h5>
        <p class="mb-1" style="color:var(--text-secondary);">Post: <strong style="color:var(--text-primary);">"{{ post.title }}"</strong></p>
        <p style="color:var(--text-muted);font-size:0.875rem;">This action cannot be undone.</p>
      </div>
      <div class="modal-footer justify-content-center" style="border-top-color:var(--border);">
        <form method="POST" action="{% url 'blog:post_delete' post.slug %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-commitlog btn-commitlog-danger">
            <i class="bi bi-trash"></i> Yes, Delete
          </button>
        </form>
        <button type="button" class="btn btn-commitlog btn-commitlog-outline" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>
{% endif %}
