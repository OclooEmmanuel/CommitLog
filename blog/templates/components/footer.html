<footer class="footer-commitlog">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6 mb-3 mb-md-0">
        <div class="footer-brand">
          <i class="fa-solid fa-terminal me-1"></i> CommitLog
        </div>
        <p class="footer-tagline">Chronicling code, creativity, and change</p>
      </div>
      <div class="col-md-6 text-md-end">
        <div class="footer-links mb-2">
          <a href="{% url 'blog:post_list' %}">Home</a>
          {% if user.is_authenticated %}
          <a href="{% url 'blog:post_add' %}">New Post</a>
          <a href="{% url 'blog:user_posts' %}">My Posts</a>
          {% endif %}
        </div>
        <div class="footer-social">
          <a href="#" aria-label="GitHub"><i class="bi bi-github"></i></a>
          <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
        </div>
      </div>
    </div>
    <p class="footer-copyright">
      &copy; {% now "Y" %} CommitLog &mdash; Crafted with Django &amp; Bootstrap
    </p>
  </div>
</footer>
