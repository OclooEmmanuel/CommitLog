{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="bg-card border-card" style="border-radius:var(--radius-lg);padding:2.5rem;">
        <h3 class="fw-bold mb-4"><i class="bi bi-pencil-square me-2"></i>New Post</h3>

        {% if error %}
        <div class="alert-commitlog alert-commitlog-error mb-4">{{ error }}</div>
        {% endif %}

        <form method="POST" class="form-commitlog">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" placeholder="Enter your post title..." required>
          </div>

          <div class="mb-3">
            <label class="form-label">Body</label>
            <textarea name="body" class="form-control" rows="6" placeholder="Write your post content here..." required></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'blog:post_list' %}" class="btn btn-commitlog btn-commitlog-outline">Cancel</a>
            <button type="submit" class="btn btn-commitlog btn-commitlog-green">
              <i class="bi bi-cloud-upload"></i> Publish Post
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
