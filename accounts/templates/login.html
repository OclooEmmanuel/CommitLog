{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h3>Welcome Back</h3>

    {% for message in messages %}
    <div class="alert-commitlog alert-commitlog-{% if message.tags == 'error' %}error{% else %}info{% endif %}">
      {{ message }}
    </div>
    {% endfor %}

    <form method="POST" class="form-commitlog">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-commitlog btn-commitlog-primary w-100">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>
    </form>

    <hr class="auth-divider">

    <p class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
